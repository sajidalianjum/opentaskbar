name: Release

# Open-source build. No secrets are required: by default the distributable
# OpenTaskbar.app + .zip is built on a clean macOS runner and attached to a
# GitHub Release using the auto-generated GITHUB_TOKEN.
#
# Optional: set the OPENTASKBAR_SIGNING_P12 secret (base64 of a .p12 exported
# from Keychain Access) plus OPENTASKBAR_SIGNING_PASSWORD to sign releases with a
# stable identity. That keeps the macOS Accessibility grant valid across updates
# so users do not have to re-grant it. See docs/RELEASE.md.
#
# Uniquely triggerable by the BUTTON in the Actions tab
# (repo > Actions > "Release" > "Run workflow") — no tag is required.
# The version is computed from the newest v* tag plus the selected bump, written
# into Resources/Info.plist, committed back to the branch, and tagged. Re-running
# with a version that already has a release is refused unless allow_existing is
# set, so a stray run can no longer overwrite a published release. The release
# lands at:
#   https://github.com/OWNER/opentaskbar/releases/tag/v<version>

on:
  workflow_dispatch:   # the "button"
    inputs:
      bump:
        description: 'Version bump from the latest tag'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 'Explicit version override (x.y.z); ignores the bump choice.'
        required: false
        default: ''
        type: string
      allow_existing:
        description: 'Overwrite the release if this version is already published.'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Branch or SHA to build from (blank = default branch HEAD).'
        required: false
        default: ''
        type: string

permissions:
  contents: write   # lets the auto-generated GITHUB_TOKEN create the Release

jobs:
  build-and-release:
    runs-on: macos-26   # GitHub-hosted; Xcode + swift preinstalled
    timeout-minutes: 30
    env:
      # Empty when the secret is unset, which keeps the default path secretless.
      OPENTASKBAR_SIGNING_P12: ${{ secrets.OPENTASKBAR_SIGNING_P12 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0     # full history + tags so release-notes.sh can diff tags
          fetch-tags: true

      - name: Import signing identity (optional)
        if: ${{ env.OPENTASKBAR_SIGNING_P12 != '' }}
        env:
          OPENTASKBAR_SIGNING_PASSWORD: ${{ secrets.OPENTASKBAR_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/opentaskbar-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$OPENTASKBAR_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" \
            -k "$KEYCHAIN" -P "${OPENTASKBAR_SIGNING_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | grep -o '"[^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "error: no code-signing identity found in the imported keychain" >&2
            exit 1
          fi
          echo "OPENTASKBAR_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing releases with identity: $IDENTITY"

      - name: Determine and bump version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="$(./Scripts/bump-version.sh "${{ inputs.version }}")"
          else
            VERSION="$(./Scripts/bump-version.sh "${{ inputs.bump }}")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      - name: Refuse to overwrite an existing release
        if: ${{ !inputs.allow_existing }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "error: ${TAG} already exists." >&2
            echo "Pick a larger bump, or tick 'allow_existing' to deliberately replace it." >&2
            exit 1
          fi

      - name: Build release bundle (.app + zip)
        run: ./Scripts/build.sh

      - name: Resolve tag and artifact paths
        id: artifact
        run: |
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/OpenTaskbar.app/Contents/Info.plist)"
          VER="${VER#v}"                     # defensive: strip a "v" prefix if present
          EXPECTED="${{ steps.version.outputs.version }}"
          if [ "${VER}" != "${EXPECTED}" ]; then
            echo "error: bundle version ${VER} does not match expected ${EXPECTED}" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "zip=build/OpenTaskbar-${VER}.zip" >> "$GITHUB_OUTPUT"
          echo "alias=build/OpenTaskbar.zip" >> "$GITHUB_OUTPUT"
          echo "checksum=build/OpenTaskbar-${VER}.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Verify bundle
        run: |
          file build/OpenTaskbar.app/Contents/MacOS/OpenTaskbar
          codesign --verify --deep --strict build/OpenTaskbar.app
          codesign -d --entitlements - build/OpenTaskbar.app || true
          SIG="$(codesign -dv build/OpenTaskbar.app 2>&1 | awk -F'=' '/^Signature/{print $2}')"
          AUTHORITY="$(codesign -dv build/OpenTaskbar.app 2>&1 | awk -F'=' '/^Authority/{print $2}')"
          echo "Signature type: ${SIG:-none}"
          echo "Authority: ${AUTHORITY:-none}"
          if [ "${OPENTASKBAR_SIGNING_P12:-}" != "" ] && [ "${SIG}" = "adhoc" ]; then
            echo "error: signing secrets are set but the build is ad-hoc signed" >&2
            exit 1
          fi

      - name: Generate release notes from commits
        env:
          OPENTASKBAR_OWNER: ${{ github.repository_owner }}
        run: ./Scripts/release-notes.sh "${{ steps.artifact.outputs.version }}" > build/release-notes.md

      - name: Commit the version bump back to the branch
        id: bump_commit
        if: ${{ inputs.ref == '' && github.ref_name == github.event.repository.default_branch }}
        continue-on-error: true
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          if git diff --quiet -- Resources/Info.plist; then
            echo "Resources/Info.plist already at ${{ steps.artifact.outputs.version }}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/Info.plist
          git commit -m "Release ${{ steps.artifact.outputs.version }} [skip ci]"
          git push origin "HEAD:${BRANCH}" || {
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            git push origin "HEAD:${BRANCH}"
          }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.tag }}
          target_commitish: ${{ steps.bump_commit.outputs.sha || github.sha }}
          name: OpenTaskbar ${{ steps.artifact.outputs.version }}
          files: |
            ${{ steps.artifact.outputs.zip }}
            ${{ steps.artifact.outputs.alias }}
            ${{ steps.artifact.outputs.checksum }}
            Scripts/install.sh
          generate_release_notes: false   # PR-based; this repo is commit-based. See Scripts/release-notes.sh
          body_path: build/release-notes.md
          fail_on_unmatched_files: true